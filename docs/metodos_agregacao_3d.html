// ============================================================================
//  Geometria comum
// ============================================================================
const R_EARTH = 1.0;      // raio Terra (unidade)
const R_LEO   = 1.55;     // órbitas NGSO (exagerado p/ visibilidade)
const R_GSO   = 4.2;      // arco geoestacionário (exagerado)
const DEG = Math.PI / 180;

// lat/lon -> Vec3 (Y = polo norte)
function latLon(latDeg, lonDeg, r = R_EARTH) {
  const la = latDeg * DEG, lo = lonDeg * DEG;
  return new THREE.Vector3(
    r * Math.cos(la) * Math.cos(lo),
    r * Math.sin(la),
    r * Math.cos(la) * Math.sin(lo)
  );
}

// viridis-ish ramp (t in 0..1) -> css
function ramp(t) {
  t = Math.max(0, Math.min(1, t));
  const r = Math.round(255 * Math.pow(t, 1.25));
  const g = Math.round(210 * (1 - Math.pow(Math.abs(t - 0.55) * 2, 2)));
  const b = Math.round(235 * Math.pow(1 - t, 1.1));
  return `rgb(${r},${g},${b})`;
}

function legendInline(ctx, W, items) {
  ctx.font = "10px ui-monospace, monospace"; ctx.textAlign = "left";
  let y = 16;
  items.forEach(([col, txt]) => {
    ctx.fillStyle = col; ctx.fillRect(W - 122, y - 7, 14, 3);
    ctx.fillStyle = "#cbd5e0"; ctx.fillText(txt, W - 104, y - 3);
    y += 14;
  });
}

function drawCCDF(kind) {
  const c = document.getElementById("ccdf-canvas");
  if (!c || !c.clientWidth || !c.clientHeight) return;
  const dpr = Math.min(window.devicePixelRatio, 2);
  const W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  const ctx = c.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const m = { l: 42, r: 10, t: 14, b: 28 };
  const EPFD_MIN = -220;
  const EPFD_AXIS_MAX = -160;
  const CCDF_MIN = 1e-5;
  const epfdToX = db => (db - EPFD_MIN) / (EPFD_AXIS_MAX - EPFD_MIN);
  const px = db => m.l + epfdToX(db) * (W - m.l - m.r);
  const ccdfToY = p => {
    const clamped = Math.max(CCDF_MIN, Math.min(1, p));
    const lo = Math.log10(CCDF_MIN), hi = 0;
    return m.t + (1 - (Math.log10(clamped) - lo) / (hi - lo)) * (H - m.t - m.b);
  };

  // grade log + eixos
  ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 1;
  [1, 0.1, 0.01, 0.001, 0.0001].forEach(p => {
    const y = ccdfToY(p);
    ctx.beginPath(); ctx.moveTo(px(EPFD_MIN), y); ctx.lineTo(px(EPFD_AXIS_MAX), y); ctx.stroke();
  });
  ctx.strokeStyle = "rgba(255,255,255,0.14)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px(EPFD_MIN), ccdfToY(CCDF_MIN)); ctx.lineTo(px(EPFD_AXIS_MAX), ccdfToY(CCDF_MIN));
  ctx.moveTo(px(EPFD_MIN), ccdfToY(1)); ctx.lineTo(px(EPFD_MIN), ccdfToY(CCDF_MIN)); ctx.stroke();

  ctx.fillStyle = "#64748b"; ctx.font = "9px ui-monospace, monospace"; ctx.textAlign = "left";
  ctx.fillText("100%", 4, ccdfToY(1) + 3);
  ctx.fillText("1%", 4, ccdfToY(0.01) + 3);
  ctx.fillText("0.01%", 4, ccdfToY(0.0001) + 3);
  ctx.fillText("0", 4, ccdfToY(CCDF_MIN) + 3);
  ctx.textAlign = "center";
  ctx.fillText(EPFD_MIN.toFixed(0), px(EPFD_MIN), H - 4);
  ctx.fillText(EPFD_AXIS_MAX.toFixed(0), px(EPFD_AXIS_MAX), H - 4);
  ctx.fillText("EPFD↓ (dBW/m²/40kHz)", px(-190), H - 4);

  // CCDF empírica: patamar → descida → queda vertical a zero no EPFD máximo.
  function ccdfCurve(color, dash, width, opts) {
    opts = opts || {};
    const epfdFlat = opts.epfdFlat != null ? opts.epfdFlat : -210;
    const epfdKnee = opts.epfdKnee != null ? opts.epfdKnee : -200;
    const epfdMax = opts.epfdMax;
    const ccdfBeforeCliff = opts.ccdfBeforeCliff != null ? opts.ccdfBeforeCliff : 0.015;
    ctx.strokeStyle = color;
    ctx.lineWidth = width || 1.8;
    ctx.setLineDash(dash || []);
    ctx.beginPath();
    ctx.moveTo(px(EPFD_MIN), ccdfToY(1));
    ctx.lineTo(px(epfdFlat), ccdfToY(1));
    const steps = 80;
    for (let i = 0; i <= steps; i++) {
      const epfd = epfdFlat + (i / steps) * (epfdMax - epfdFlat);
      let p;
      if (epfd <= epfdKnee) p = 1;
      else {
        const t = (epfd - epfdKnee) / (epfdMax - epfdKnee);
        const logP = Math.log10(1) + t * (Math.log10(ccdfBeforeCliff) - Math.log10(1));
        p = Math.pow(10, logP);
      }
      ctx.lineTo(px(epfd), ccdfToY(p));
    }
    ctx.lineTo(px(epfdMax), ccdfToY(CCDF_MIN));
    ctx.stroke();
    ctx.setLineDash([]);
    return { epfdMax };
  }

  if (kind === "single") {
    ccdfCurve("#38bdf8", [5, 4], 1.5, { epfdFlat: -205, epfdKnee: -195, epfdMax: -187, ccdfBeforeCliff: 0.02 });
    ccdfCurve("#c084fc", [3, 3], 1.5, { epfdFlat: -205, epfdKnee: -196, epfdMax: -188, ccdfBeforeCliff: 0.018 });
    ccdfCurve("#ff8c42", [], 2.2, { epfdFlat: -200, epfdKnee: -185, epfdMax: -171, ccdfBeforeCliff: 0.012 });
    legendInline(ctx, W, [["#38bdf8", "single-entry 1"], ["#c084fc", "single-entry 2"], ["#ff8c42", "agregada (conv.)"]]);
  } else if (kind === "envelope") {
    [-195, -190, -185, -180, -175, -170].forEach((epfdMax, k) =>
      ccdfCurve("rgba(148,163,184,0.45)", [], 1.0, { epfdFlat: -210, epfdKnee: -205 + k * 2, epfdMax, ccdfBeforeCliff: 0.02 - k * 0.002 })
    );
    ccdfCurve("#ff3b3b", [], 2.4, { epfdFlat: -198, epfdKnee: -178, epfdMax: -165, ccdfBeforeCliff: 0.01 });
    legendInline(ctx, W, [["rgba(148,163,184,0.7)", "CCDF por ponto"], ["#ff3b3b", "envelope (pior)"]]);
  } else if (kind === "joint") {
    ccdfCurve("#38bdf8", [5, 4], 1.3, { epfdFlat: -205, epfdKnee: -195, epfdMax: -187, ccdfBeforeCliff: 0.02 });
    ccdfCurve("#ff8c42", [4, 3], 1.5, { epfdFlat: -200, epfdKnee: -185, epfdMax: -171, ccdfBeforeCliff: 0.012 });
    ccdfCurve("#34d399", [], 2.4, { epfdFlat: -202, epfdKnee: -190, epfdMax: -178, ccdfBeforeCliff: 0.014 });
    legendInline(ctx, W, [["#38bdf8", "single"], ["#ff8c42", "post_sum (conv.)"], ["#34d399", "joint"]]);
  } else if (kind === "perwcg") {
    ccdfCurve("#ff8c42", [], 2.0, { epfdFlat: -203, epfdKnee: -188, epfdMax: -176, ccdfBeforeCliff: 0.013 });
    ccdfCurve("#c084fc", [], 2.0, { epfdFlat: -204, epfdKnee: -192, epfdMax: -169, ccdfBeforeCliff: 0.011 });
    ccdfCurve("#38bdf8", [], 2.0, { epfdFlat: -201, epfdKnee: -186, epfdMax: -173, ccdfBeforeCliff: 0.012 });
    legendInline(ctx, W, [["#ff8c42", "agg @ WCG A"], ["#c084fc", "agg @ WCG B"], ["#38bdf8", "agg @ WCG C"]]);
  } else if (kind === "gridconv") {
    [-195, -190, -185, -180, -175, -170].forEach((epfdMax, k) =>
      ccdfCurve("rgba(148,163,184,0.45)", [], 1.0, { epfdFlat: -210, epfdKnee: -205 + k * 2, epfdMax, ccdfBeforeCliff: 0.02 - k * 0.002 })
    );
    legendInline(ctx, W, [["rgba(148,163,184,0.7)", "CCDF agregada por ponto (conv.)"]]);
  }
}

// Arco GSO (anel equatorial)
function buildGsoArc() {
  const pts = [];
  for (let a = 0; a <= 360; a += 2) pts.push(latLon(0, a, R_GSO));
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0xb08d2e, transparent: true, opacity: 0.4 })
  );
}

// ---- fábricas de objetos ----
const NGSO_SAT_R = 0.028;
const GSO_SAT_R = 0.058;

function makeSat(color, size = NGSO_SAT_R) {
  return new THREE.Mesh(
    new THREE.SphereGeometry(size, 10, 10),
    new THREE.MeshBasicMaterial({ color })
  );
}
function makeGsoSat(lonDeg, color = 0xf2c14e) {
  const m = new THREE.Mesh(
    new THREE.OctahedronGeometry(GSO_SAT_R),
    new THREE.MeshBasicMaterial({ color })
  );
  m.position.copy(latLon(0, lonDeg, R_GSO));
  return m;
}
function makeES(latDeg, lonDeg, color = 0x4fd1c5) {
  const p = latLon(latDeg, lonDeg, R_EARTH);
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(0.05, 0.14, 12),
    new THREE.MeshBasicMaterial({ color })
  );
  cone.position.copy(p.clone().multiplyScalar(1.07));
  cone.lookAt(p.clone().multiplyScalar(2));
  cone.rotateX(Math.PI / 2);
  return cone;
}
function makeLabel(text, color = "#e6eaf2") {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 64;
  const ctx = c.getContext("2d");
  ctx.font = "bold 30px ui-monospace, monospace";
  ctx.fillStyle = color;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  spr.scale.set(0.9, 0.225, 1);
  return spr;
}
// linha-feixe ES->alvo reaproveitável
function makeBeam(color) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));
  const line = new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.85 }));
  line.frustumCulled = false;
  return line;
}
function setBeam(line, from, to) {
  const p = line.geometry.attributes.position.array;
  p[0]=from.x; p[1]=from.y; p[2]=from.z; p[3]=to.x; p[4]=to.y; p[5]=to.z;
  line.geometry.attributes.position.needsUpdate = true;
}

// Constelação NGSO. Plano orbital: tilt (inclinação) + RAAN; satélites girando.
function makeConstellation({ color, nSats, r = R_LEO, inc = 53, raan = 0, speed = 0.5, phase0 = 0 }) {
  const orbitGroup = new THREE.Group();
  orbitGroup.rotation.z = inc * DEG;
  orbitGroup.rotation.y = raan * DEG;
  const spin = new THREE.Group();
  orbitGroup.add(spin);
  // anel da órbita
  const ringPts = [];
  for (let a = 0; a <= 360; a += 4)
    ringPts.push(new THREE.Vector3(r * Math.cos(a*DEG), 0, r * Math.sin(a*DEG)));
  orbitGroup.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(ringPts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.28 })
  ));
  const sats = [];
  for (let i = 0; i < nSats; i++) {
    const s = makeSat(color);
    const a = (i / nSats) * Math.PI * 2;
    s.userData.a0 = a;
    s.position.set(r * Math.cos(a), 0, r * Math.sin(a));
    spin.add(s);
    sats.push(s);
  }
  return {
    group: orbitGroup, sats, color,
    update(t) { spin.rotation.y = phase0 + speed * t; }
  };
}

function clearMethod() {
  if (!gfxReady) return;
  scene.remove(methodRoot);
  methodRoot.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); }
  });
  methodRoot = new THREE.Group();
  scene.add(methodRoot);
  updaters = [];
}

const SYS_COLORS = [0xff8c42, 0xc084fc, 0x38bdf8, 0xf472b6];

// ---- MÉTODO 1: cada sistema no seu próprio WCG ----
function buildMethod1() {
  clearMethod();
  methodRoot.add(buildGsoArc());

  // 3 sistemas, cada um com SUA ES (WCG distinto) + GSO sat + constelação + feixe
  const setups = [
    { es:[ 38,  20], gsoLon:  10, inc: 53, raan:  10, color: SYS_COLORS[0], name:"A" },
    { es:[-25, 140], gsoLon: 150, inc: 70, raan: 120, color: SYS_COLORS[1], name:"B" },
    { es:[ 10, -80], gsoLon: -75, inc: 33, raan: 230, color: SYS_COLORS[2], name:"C" },
  ];
  setups.forEach((s, idx) => {
    const esPos = latLon(s.es[0], s.es[1]);
    const gso = makeGsoSat(s.gsoLon, s.color);
    methodRoot.add(gso);
    methodRoot.add(makeES(s.es[0], s.es[1], s.color));
    const lab = makeLabel("WCG " + s.name, "#" + s.color.toString(16).padStart(6,"0"));
    lab.position.copy(esPos.clone().multiplyScalar(1.28));
    methodRoot.add(lab);
    // feixe desejado ES->GSO (referência, fino)
    const want = makeBeam(s.color);
    want.material.opacity = 0.35;
    setBeam(want, esPos.clone().multiplyScalar(1.05), gso.position);
    methodRoot.add(want);
    // constelação
    const con = makeConstellation({ color: s.color, nSats: 9, inc: s.inc, raan: s.raan, speed: 0.5 + idx*0.12 });
    methodRoot.add(con.group);
    // feixe de interferência ES->sat mais próximo do eixo ES-GSO
    const intf = makeBeam(0xffffff);
    methodRoot.add(intf);
    const axis = gso.position.clone().sub(esPos).normalize();
    updaters.push((t) => {
      con.update(t);
      scene.updateMatrixWorld(true);
      // escolhe sat com menor ângulo α em relação ao eixo ES->GSO
      let best = null, bestDot = -2;
      const w = new THREE.Vector3();
      con.sats.forEach(sat => {
        sat.getWorldPosition(w);
        const d = w.clone().sub(esPos).normalize().dot(axis);
        if (d > bestDot) { bestDot = d; best = w.clone(); }
      });
      if (best) {
        setBeam(intf, esPos.clone().multiplyScalar(1.05), best);
        const close = bestDot > 0.92;     // dentro do feixe -> interfere
        intf.material.color.set(close ? 0xff3b3b : 0x59617a);
        intf.material.opacity = close ? 0.95 : 0.3;
      }
    });
  });

  setSceneTitle("Método 1 — Convolução das CCDFs pós-WCG",
    "Cada sistema simulado isolado no seu pior caso geométrico (WCG). 3 ES distintas — não há ponto físico comum.");
  setLegend([
    ["dot", "#ff8c42", "Sistema A · sua ES/WCG"],
    ["dot", "#c084fc", "Sistema B · sua ES/WCG"],
    ["dot", "#38bdf8", "Sistema C · sua ES/WCG"],
    ["dot", "#f2c14e", "satélite GSO (vítima)"],
    ["dot", "#ff3b3b", "NGSO dentro do feixe (interfere)"],
  ]);
}

// ---- Grid Stage 1: ES (lat,lon) × GSO_lon visível (Métodos 2 e 5) ----
const GRID_LATS = [-60, -30, 0, 30, 60];
const GRID_LONS = [-150, -120, -90, -60, -30, 0, 30, 60, 90, 120, 150];
const GSO_LON_GRID = [-150, -120, -90, -60, -30, 0, 30, 60, 90, 120, 150];
const MIN_GSO_EL_DEG = 5;

function gsoElevationDeg(esLat, esLon, gsoLon) {
  const rho = 6378.137 / 42164.0;
  const lat = esLat * DEG;
  const dlon = (gsoLon - esLon) * DEG;
  const cosGamma = Math.cos(lat) * Math.cos(dlon);
  if (cosGamma <= rho) return -90;
  const gamma = Math.acos(Math.max(-1, Math.min(1, cosGamma)));
  return Math.atan2(cosGamma - rho, Math.sin(gamma)) / DEG;
}

function visibleGsoLons(esLat, esLon) {
  return GSO_LON_GRID.filter(lon => gsoElevationDeg(esLat, esLon, lon) >= MIN_GSO_EL_DEG);
}

function buildGridStage1Scene(opts) {
  clearMethod();
  methodRoot.add(buildGsoArc());

  // N sistemas NGSO distintos — mesma geometria ES/GSO, órbitas diferentes
  const cons = [
    makeConstellation({ color: SYS_COLORS[0], nSats: 10, inc: 53, raan: 20,  speed: 0.50, phase0: 0 }),
    makeConstellation({ color: SYS_COLORS[1], nSats: 9,  inc: 70, raan: 120, speed: 0.55, phase0: 0.9 }),
    makeConstellation({ color: SYS_COLORS[2], nSats: 10, inc: 33, raan: 230, speed: 0.48, phase0: 1.5 }),
  ];
  cons.forEach(c => {
    methodRoot.add(c.group);
    updaters.push(t => c.update(t));
  });

  const worstLat = opts.worstLat != null ? opts.worstLat : 30;
  const worstLon = opts.worstLon != null ? opts.worstLon : -60;
  const pts = [];
  let worst = null, worstVal = -Infinity;
  GRID_LATS.forEach(la => GRID_LONS.forEach(lo => {
    const d = Math.hypot((la - worstLat) / 45, ((((lo - worstLon) + 540) % 360 - 180)) / 80);
    const val = 0.25 + 0.75 * Math.exp(-d * d);
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.032, 10, 10),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(ramp(val)), transparent: true, opacity: 0.5 })
    );
    dot.position.copy(latLon(la, lo, R_EARTH * 1.02));
    dot.userData = { val, la, lo };
    methodRoot.add(dot);
    pts.push(dot);
    if (val > worstVal) { worstVal = val; worst = dot; }
  }));

  const gsoMarkers = GSO_LON_GRID.map(lon => {
    const sat = makeGsoSat(lon, 0x6b5424);
    sat.material.transparent = true;
    sat.material.opacity = 0.18;
    sat.scale.set(0.38, 0.38, 0.38);
    methodRoot.add(sat);
    return { lon, sat };
  });

  if (opts.showEnvelope && worst) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.09, 0.014, 8, 24),
      new THREE.MeshBasicMaterial({ color: 0xff3b3b })
    );
    ring.position.copy(worst.position.clone().multiplyScalar(1.008));
    ring.lookAt(worst.position.clone().multiplyScalar(2));
    methodRoot.add(ring);
    const wlab = makeLabel("envelope (pior)", "#ff6b6b");
    wlab.position.copy(worst.position.clone().multiplyScalar(1.35));
    methodRoot.add(wlab);
  }

  if (opts.hotIndices) {
    opts.hotIndices.forEach((idx, k) => {
      if (!pts[idx]) return;
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.055, 0.012, 8, 24),
        new THREE.MeshBasicMaterial({ color: [0xf472b6, 0xa78bfa, 0x34d399, 0xfbbf24, 0x60a5fa][k % 5], transparent: true, opacity: 0.85 })
      );
      ring.position.copy(pts[idx].position.clone().multiplyScalar(1.008));
      ring.lookAt(pts[idx].position.clone().multiplyScalar(2));
      methodRoot.add(ring);
    });
    const wlab = makeLabel(opts.hotLabel || "N_geom CCDFs agregadas", "#34d399");
    wlab.position.copy(latLon(55, 0, R_EARTH * 1.45));
    methodRoot.add(wlab);
  }

  const scanner = new THREE.Mesh(
    new THREE.RingGeometry(0.05, 0.075, 24),
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
  );
  methodRoot.add(scanner);

  const activeBeam = makeBeam(0xfde047);
  activeBeam.material.opacity = 0.92;
  methodRoot.add(activeBeam);

  const visBeams = GSO_LON_GRID.map(() => {
    const b = makeBeam(0x94a3b8);
    b.material.opacity = 0;
    methodRoot.add(b);
    return b;
  });

  const geomHud = makeLabel("grid …", "#fde047");
  geomHud.scale.set(1.45, 0.36, 1);
  methodRoot.add(geomHud);

  let esIdx = 0, gsoStep = 0, sweepT = 0;
  const period = opts.sweepPeriod != null ? opts.sweepPeriod : 0.24;

  function paintGeomHud(la, lo, gsoLon, nVis, step, total) {
    const c = document.createElement("canvas");
    c.width = 420; c.height = 76;
    const ctx = c.getContext("2d");
    ctx.font = "bold 19px ui-monospace, monospace";
    ctx.fillStyle = "#fde047";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(`ES(${la.toFixed(0)}°, ${lo.toFixed(0)}°)  ·  GSO_lon ${gsoLon.toFixed(0)}°  [${step}/${total}]`, 210, 26);
    ctx.font = "15px ui-monospace, monospace";
    ctx.fillStyle = "#94a3b8";
    ctx.fillText(`${nVis} longitudes GSO visíveis p/ esta ES`, 210, 52);
    geomHud.material.map.image = c;
    geomHud.material.map.needsUpdate = true;
  }

  updaters.push((t, dt) => {
    sweepT += dt;
    const cur = pts[esIdx];
    let vis = visibleGsoLons(cur.userData.la, cur.userData.lo);
    if (vis.length === 0) vis = [0];

    if (sweepT >= period) {
      sweepT = 0;
      gsoStep++;
      if (gsoStep >= vis.length) {
        gsoStep = 0;
        esIdx = (esIdx + 1) % pts.length;
      }
    }

    const { la, lo } = pts[esIdx].userData;
    vis = visibleGsoLons(la, lo);
    if (vis.length === 0) vis = [0];
    const activeGsoLon = vis[gsoStep % vis.length];

    scanner.position.copy(pts[esIdx].position.clone().multiplyScalar(1.012));
    scanner.lookAt(pts[esIdx].position.clone().multiplyScalar(2));
    pts.forEach(p => { p.material.opacity = 0.28 + p.userData.val * 0.35; });
    pts[esIdx].material.opacity = 1.0;

    gsoMarkers.forEach(({ lon, sat }, i) => {
      const isVis = vis.includes(lon);
      const isActive = lon === activeGsoLon;
      sat.material.opacity = isActive ? 1.0 : (isVis ? 0.5 : 0.12);
      sat.material.color.setHex(isActive ? 0xf2c14e : (isVis ? 0xb08d2e : 0x6b5424));
      const s = isActive ? 0.62 : 0.38;
      sat.scale.set(s, s, s);
      const b = visBeams[i];
      if (isVis && !isActive) {
        setBeam(b, pts[esIdx].position.clone(), sat.position);
        b.material.opacity = 0.2;
      } else {
        b.material.opacity = 0;
      }
    });

    setBeam(activeBeam, pts[esIdx].position.clone(), latLon(0, activeGsoLon, R_GSO));
    geomHud.position.copy(pts[esIdx].position.clone().multiplyScalar(1.38));
    paintGeomHud(la, lo, activeGsoLon, vis.length, gsoStep + 1, vis.length);
  });

  setSceneTitle(opts.title, opts.sub);
  setLegend(opts.legend);
}

// ---- MÉTODO 3: joint — megaconstelação simultânea, soma instantânea ----
function buildMethod3() {
  clearMethod();
  methodRoot.add(buildGsoArc());

  // UMA ES comum + UM GSO sat
  const esLL = [25, -10];
  const esPos = latLon(esLL[0], esLL[1]);
  const gsoLon = -10;
  const gso = makeGsoSat(gsoLon);
  methodRoot.add(gso);
  methodRoot.add(makeES(esLL[0], esLL[1]));
  const lab = makeLabel("ES comum", "#4fd1c5");
  lab.position.copy(esPos.clone().multiplyScalar(1.30));
  methodRoot.add(lab);
  const axis = gso.position.clone().sub(esPos).normalize();

  // feixe desejado ES->GSO
  const want = makeBeam(0x4fd1c5);
  want.material.opacity = 0.4;
  setBeam(want, esPos.clone().multiplyScalar(1.05), gso.position);
  methodRoot.add(want);

  // 2 constelações fundidas (megaconstelação), tempos coerentes (mesmo t)
  const cons = [
    makeConstellation({ color: SYS_COLORS[0], nSats: 11, inc: 53,  raan: 20,  speed: 0.6 }),
    makeConstellation({ color: SYS_COLORS[2], nSats: 11, inc: 75,  raan: 130, speed: 0.6, phase0: 1.2 }),
  ];
  cons.forEach(c => methodRoot.add(c.group));

  // feixe por satélite (acende quando dentro do feixe da ES)
  const beams = [];
  cons.forEach(c => c.sats.forEach(() => { const b = makeBeam(0x59617a); methodRoot.add(b); beams.push(b); }));

  // medidor de soma instantânea
  const meter = makeLabel("Σ = … dBW", "#fde047");
  meter.scale.set(1.4, 0.35, 1);
  meter.position.copy(esPos.clone().multiplyScalar(1.55));
  methodRoot.add(meter);
  let meterAccum = 0;

  updaters.push((t, dt) => {
    cons.forEach(c => c.update(t));
    scene.updateMatrixWorld(true);
    let bi = 0, linSum = 0, nContrib = 0;
    const w = new THREE.Vector3();
    cons.forEach(c => c.sats.forEach(sat => {
      sat.getWorldPosition(w);
      const dirDot = w.clone().sub(esPos).normalize().dot(axis);   // proximidade do eixo
      const inFront = w.clone().sub(esPos).dot(axis) > 0;
      const close = dirDot > 0.93 && inFront;
      const b = beams[bi++];
      setBeam(b, esPos.clone().multiplyScalar(1.05), w.clone());
      b.material.color.set(close ? 0xff3b3b : 0x39405a);
      b.material.opacity = close ? 0.95 : 0.12;
      if (close) {
        // EPFD ilustrativo: cresce ao aproximar do eixo
        const epfd = -180 + 60 * (dirDot - 0.93) / 0.07;
        linSum += Math.pow(10, epfd / 10);
        nContrib++;
      }
    }));
    // atualiza medidor ~6x/s
    meterAccum += dt;
    if (meterAccum > 0.16) {
      meterAccum = 0;
      const total = linSum > 0 ? (10 * Math.log10(linSum)).toFixed(0) : "—";
      const c = document.createElement("canvas"); c.width = 256; c.height = 64;
      const ctx = c.getContext("2d");
      ctx.font = "bold 26px ui-monospace, monospace";
      ctx.fillStyle = nContrib > 0 ? "#fde047" : "#64748b";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(`Σ=${total} dBW (${nContrib})`, 128, 32);
      meter.material.map.image = c; meter.material.map.needsUpdate = true;
    }
  });

  setSceneTitle("Método 3 — Simulação conjunta (Method 2B)",
    "N constelações fundidas numa megaconstelação, propagadas no MESMO t₀. Uma ES comum. Soma a contribuição instantânea de TODOS os satélites.");
  setLegend([
    ["dot", "#4fd1c5", "ES comum (geometria única)"],
    ["dot", "#ff8c42", "constelação 1 (megaconst.)"],
    ["dot", "#38bdf8", "constelação 2 (megaconst.)"],
    ["dot", "#ff3b3b", "satélite contribuindo agora"],
    ["dot", "#fde047", "Σ instantânea (dBW)"],
  ]);
}

// ---- MÉTODO 4: convolução em cada WCG single-entry (N ancoragens) ----
let m4anchorIdx = 0, m4anchorT = 0;
function buildMethod4() {
  clearMethod();
  methodRoot.add(buildGsoArc());

  const setups = [
    { es:[ 38,  20], gsoLon:  10, inc: 53, raan:  10, color: SYS_COLORS[0], name:"A" },
    { es:[-25, 140], gsoLon: 150, inc: 70, raan: 120, color: SYS_COLORS[1], name:"B" },
    { es:[ 10, -80], gsoLon: -75, inc: 33, raan: 230, color: SYS_COLORS[2], name:"C" },
  ];
  const anchors = [];
  setups.forEach((s, idx) => {
    const esPos = latLon(s.es[0], s.es[1]);
    const gso = makeGsoSat(s.gsoLon, s.color);
    methodRoot.add(gso);
    methodRoot.add(makeES(s.es[0], s.es[1], s.color));
    const lab = makeLabel("WCG " + s.name, "#" + s.color.toString(16).padStart(6,"0"));
    lab.position.copy(esPos.clone().multiplyScalar(1.28));
    methodRoot.add(lab);
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.10, 0.016, 8, 28),
      new THREE.MeshBasicMaterial({ color: s.color, transparent: true, opacity: 0.25 })
    );
    ring.position.copy(esPos.clone().multiplyScalar(1.03));
    ring.lookAt(esPos.clone().multiplyScalar(2));
    methodRoot.add(ring);
    const want = makeBeam(s.color);
    want.material.opacity = 0.35;
    setBeam(want, esPos.clone().multiplyScalar(1.05), gso.position);
    methodRoot.add(want);
    const con = makeConstellation({ color: s.color, nSats: 8, inc: s.inc, raan: s.raan, speed: 0.45 + idx * 0.1 });
    methodRoot.add(con.group);
    anchors.push({ esPos, gso, ring, con, color: s.color, name: s.name });
  });

  const aggLab = makeLabel("ancoragem ativa", "#fde047");
  aggLab.scale.set(1.1, 0.28, 1);
  methodRoot.add(aggLab);
  const aggBeams = anchors.map(() => makeBeam(0xffffff));
  aggBeams.forEach(b => { b.material.opacity = 0.4; methodRoot.add(b); });

  m4anchorIdx = 0; m4anchorT = 0;
  updaters.push((t, dt) => {
    anchors.forEach(a => a.con.update(t));
    m4anchorT += dt;
    if (m4anchorT > 1.4) { m4anchorT = 0; m4anchorIdx = (m4anchorIdx + 1) % anchors.length; }
    const active = anchors[m4anchorIdx];
    active.ring.material.opacity = 0.95;
    active.ring.scale.set(1.15, 1.15, 1.15);
    aggLab.position.copy(active.esPos.clone().multiplyScalar(1.42));
    const c = document.createElement("canvas"); c.width = 256; c.height = 64;
    const ctx = c.getContext("2d");
    ctx.font = "bold 24px ui-monospace, monospace";
    ctx.fillStyle = "#fde047";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(`ancora WCG ${active.name}`, 128, 32);
    aggLab.material.map.image = c; aggLab.material.map.needsUpdate = true;
    const axis = active.gso.position.clone().sub(active.esPos).normalize();
    const w = new THREE.Vector3();
    anchors.forEach((a, ai) => {
      const on = ai === m4anchorIdx;
      a.ring.material.opacity = on ? 0.95 : 0.2;
      a.ring.scale.set(on ? 1.15 : 1.0, on ? 1.15 : 1.0, on ? 1.15 : 1.0);
      aggBeams[ai].material.color.set(on ? 0xff3b3b : 0x39405a);
      aggBeams[ai].material.opacity = on ? 0.85 : 0.08;
      if (!on) return;
      let best = null, bestDot = -2;
      a.con.sats.forEach(sat => {
        sat.getWorldPosition(w);
        const d = w.clone().sub(active.esPos).normalize().dot(axis);
        if (d > bestDot) { bestDot = d; best = w.clone(); }
      });
      if (best) setBeam(aggBeams[ai], active.esPos.clone().multiplyScalar(1.05), best);
    });
  });

  setSceneTitle("Método 4 — Convolução por WCG single-entry",
    "Cada filing traz seu WCG (WCGA). Em cada ancoragem g_i, simulam-se os N sistemas na mesma geometria e convoluem-se as CCDFs → N curvas agregadas.");
  setLegend([
    ["dot", "#ff8c42", "WCG A · ancoragem"],
    ["dot", "#c084fc", "WCG B · ancoragem"],
    ["dot", "#38bdf8", "WCG C · ancoragem"],
    ["dot", "#fde047", "ancoragem ativa (ciclo)"],
    ["dot", "#ff3b3b", "todos os filings na mesma ES/GSO"],
  ]);
}

// ============================================================================
//  Overlays (título de cena + legenda)
// ============================================================================
function setSceneTitle(t, sub) {
  document.getElementById("scene-title").innerHTML = `${t}<small>${sub}</small>`;
}
function setLegend(rows) {
  document.getElementById("legend").innerHTML = rows.map(([type, col, txt]) => {
    const sw = type === "bar"
      ? `<span class="bar" style="background:${col};border-radius:2px;"></span>`
      : `<span class="dot" style="background:${col};"></span>`;
    return `<div class="row">${sw}<span>${txt}</span></div>`;
  }).join("");
}

// ============================================================================
//  Troca de método
// ============================================================================
function selectMethod(m) {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.m == m));
  simTime = 0;
  if (gfxReady) {
    if (m == 1) buildMethod1();
    else if (m == 2) buildMethod2();
    else if (m == 3) buildMethod3();
    else if (m == 4) buildMethod4();
    else buildMethod5();
  }
  renderPanel(m);
}
document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => selectMethod(b.dataset.m)));

// controles
document.getElementById("btn-play").addEventListener("click", e => {
  playing = !playing; e.target.textContent = playing ? "⏸ Pausar" : "▶ Retomar";
});
document.getElementById("btn-rotate").addEventListener("click", e => {
  if (!gfxReady) return;
  controls.autoRotate = !controls.autoRotate;
  e.target.textContent = "⟲ Auto-girar: " + (controls.autoRotate ? "on" : "off");
});
document.getElementById("btn-reset").addEventListener("click", () => {
  if (!gfxReady) return;
  camera.position.copy(CAM_HOME); controls.target.set(0,0,0); controls.update();
});

// ============================================================================
//  Loop de render
// ============================================================================
function resize() {
  if (!gfxReady) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", () => {
  resize();
  const tab = document.querySelector(".tab.active");
  if (tab) drawCCDF(PANEL[tab.dataset.m].ccdf);
});

(function initPanelResize() {
  const main = document.getElementById("main");
  const resizer = document.getElementById("panel-resizer");
  const MIN_W = 260, DEFAULT_W = 380;
  const storageKey = "metodos_agregacao_3d_panel_width";
  try {
    const saved = parseInt(localStorage.getItem(storageKey), 10);
    if (saved >= MIN_W) main.style.setProperty("--panel-width", saved + "px");
  } catch (_) {}

  function panelMaxW() {
    return Math.max(MIN_W + 80, Math.min(720, Math.round(window.innerWidth * 0.62)));
  }
  function setPanelWidth(px) {
    main.style.setProperty("--panel-width", Math.max(MIN_W, Math.min(panelMaxW(), px)) + "px");
  }
  function onResizeEnd() {
    resize();
    const tab = document.querySelector(".tab.active");
    if (tab) drawCCDF(PANEL[tab.dataset.m].ccdf);
    try {
      localStorage.setItem(storageKey, parseInt(getComputedStyle(main).getPropertyValue("--panel-width"), 10));
    } catch (_) {}
  }

  let dragging = false;
  resizer.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    dragging = true;
    resizer.classList.add("dragging");
    document.body.classList.add("panel-resizing");
  });
  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    const rect = main.getBoundingClientRect();
    setPanelWidth(rect.right - e.clientX - resizer.offsetWidth / 2);
    resize();
    const tab = document.querySelector(".tab.active");
    if (tab) drawCCDF(PANEL[tab.dataset.m].ccdf);
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove("dragging");
    document.body.classList.remove("panel-resizing");
    onResizeEnd();
  });
  resizer.addEventListener("dblclick", () => {
    setPanelWidth(DEFAULT_W);
    onResizeEnd();
  });
})();

let last = performance.now();
function loop(now) {
  if (!gfxReady) return;
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing) simTime += dt;
  updaters.forEach(u => u(simTime, playing ? dt : 0));
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

if (gfxReady) {
  resize();
  selectMethod(1);
  requestAnimationFrame(loop);
} else {
  selectMethod(1);
}
</script>
