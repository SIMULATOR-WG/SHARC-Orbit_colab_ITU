[server]
headless = false
# Serves streamlit_app/static/ at /app/static/ — carries the vendored Plotly
# topojson so geo charts never call out to cdn.plot.ly (see lib/plots.py).
enableStaticServing = true
# No first-run `Email:` prompt: it is the only code path that would reach
# data.streamlit.io, and it blocks startup until answered.
showEmailPrompt = false
runOnSave = true
fileWatcherType = "auto"
maxUploadSize = 2048

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#4fd1c5"
backgroundColor = "#0a0e17"
secondaryBackgroundColor = "#0d1320"
textColor = "#e6eaf2"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "full"

[logger]
level = "info"
