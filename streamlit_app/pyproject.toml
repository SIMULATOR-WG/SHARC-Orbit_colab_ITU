[project]
name = "sharc-orbit-streamlit"
version = "0.1.0-preliminary"
description = "Stage 1 EPFD aggregation simulator (Resolution 76 / ITU-R S.1503 / S.1588) — Python-only Streamlit UI per Ofício 2309/2026/ORER/SOR-Anatel."
requires-python = ">=3.10"
license = { text = "TBD" }

dependencies = [
    "streamlit>=1.36",
    "plotly>=5.20",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.59",
    "joblib>=1.3",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]

[tool.ruff]
line-length = 100
target-version = "py310"
